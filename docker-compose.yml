services:
  mysql:
    container_name: cadastro-conta-digital-mysql
    image: mysql:8.4
    ports:
      - 3308:3306
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    container_name: cadastro-conta-digital-redis
    image: redis:7-alpine
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  hyperf-skeleton:
    container_name: hyperf-skeleton
    image: hyperf-skeleton
    build:
      dockerfile: dev.Dockerfile
      args:
        UID: 1000
        GID: 1000
    user: "0:0"
    entrypoint:
      - sh
      - -lc
      - rm -rf runtime/container && mkdir -p runtime/container/proxy && exec php bin/hyperf.php start
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/opt/www
      - hyperf-runtime:/opt/www/runtime
    ports:
      - 9501:9501
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      DB_DRIVER: ${DB_DRIVER}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CHARSET: ${DB_CHARSET}
      DB_COLLATION: ${DB_COLLATION}
      DB_PREFIX: ${DB_PREFIX}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_AUTH: ${REDIS_AUTH}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      SCAN_CACHEABLE: "false"
      CONFIG_CENTER_ENABLE: "false"

networks:
  default:
    name: hyperf-skeleton

volumes:
  hyperf-runtime:
  mysql-data:
