services:
  redis:
    container_name: cadastro-conta-digital-redis
    image: redis:7-alpine
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  hyperf-skeleton:
    container_name: hyperf-skeleton
    image: hyperf-skeleton
    build:
      dockerfile: dev.Dockerfile
      args:
        UID: 1000
        GID: 1000
    user: "0:0"
    entrypoint:
      - sh
      - -lc
      - rm -rf runtime/container && mkdir -p runtime/container/proxy && exec php bin/hyperf.php start
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./:/opt/www
      - hyperf-runtime:/opt/www/runtime
    ports:
      - 9501:9501
    environment:
      - APP_ENV=dev
      - SCAN_CACHEABLE=false
      - CONFIG_CENTER_ENABLE=false
      - REDIS_HOST=redis

networks:
  default:
    name: hyperf-skeleton

volumes:
  hyperf-runtime:
